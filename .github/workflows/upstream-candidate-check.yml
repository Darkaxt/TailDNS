name: TailDNS upstream candidate checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch to verify with the trusted main workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'automation/upstream-candidate') || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.candidate_ref == 'automation/upstream-candidate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.event.pull_request.head.sha }}
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify candidate without signing authority
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;23.1.7779620'
          version_code_base="$(( $(git show -s --format=%ct HEAD) / 60 * 10 ))"
          test "$version_code_base" -lt 2147483640
          VERSION_CODE_BASE="$version_code_base" make version libtailscale
          make go-test
          core_dir="$(./tool/go list -m -f '{{.Dir}}' tailscale.com)"
          go_bin="$(./tool/go env GOROOT)/bin/go"
          (cd "$core_dir" && "$go_bin" test -mod=readonly ./ipn/... ./net/dns/... ./client/local ./cmd/taildns ./safesocket -count=1)
          (cd android && ./gradlew ktfmtCheck test assembleRelease -PVERSION_CODE_BASE="$version_code_base")
          (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/taildns.exe" ./cmd/taildns)
          (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/taildnsd.exe" ./cmd/tailscaled)
          (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/tailscale.exe" ./cmd/tailscale)
